<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">AI system flow</title>
  <desc id="desc">User Goal flows to Planner, Retrieval and Tools, Execution, Validation, and Final Output, with a retry repair loop back to Planner.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050816"/>
      <stop offset="0.48" stop-color="#0B1430"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(590 120) rotate(90) scale(240 520)">
      <stop stop-color="#2563EB" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="86" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111827"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="150" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#7AA2F7"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" stroke="#94A3B8" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#020617" flood-opacity="0.5"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2L10 6L2 10" fill="none" stroke="#7AA2F7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowSoft" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2L10 6L2 10" fill="none" stroke="#38BDF8" stroke-opacity="0.75" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1200" height="320" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="28" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="28" fill="url(#glow)"/>
  <path d="M180 153H230" stroke="#7AA2F7" stroke-width="2" stroke-opacity="0.75" marker-end="url(#arrow)"/>
  <path d="M370 153H460" stroke="#7AA2F7" stroke-width="2" stroke-opacity="0.75" marker-end="url(#arrow)"/>
  <path d="M600 118H680" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.72" marker-end="url(#arrowSoft)"/>
  <path d="M600 188H680" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.72" marker-end="url(#arrowSoft)"/>
  <path d="M820 153H870" stroke="#7AA2F7" stroke-width="2" stroke-opacity="0.75" marker-end="url(#arrow)"/>
  <path d="M1010 153H1048" stroke="#7AA2F7" stroke-width="2" stroke-opacity="0.75" marker-end="url(#arrow)"/>
  <path d="M940 218C918 284 306 284 300 220" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.42" stroke-dasharray="7 7" marker-end="url(#arrowSoft)"/>
  <text x="618" y="288" fill="#93C5FD" font-family="JetBrains Mono, Fira Code, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" text-anchor="middle">retry / repair</text>
  <g filter="url(#shadow)">
    <rect x="40" y="111" width="140" height="84" rx="18" fill="url(#card)" stroke="#334155"/>
    <rect x="40" y="111" width="140" height="3" rx="1.5" fill="url(#accent)"/>
    <text x="110" y="160" fill="#E6EDF3" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="700" text-anchor="middle">User Goal</text>
    <text x="110" y="181" fill="#94A3B8" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" text-anchor="middle">intent + constraints</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="230" y="111" width="140" height="84" rx="18" fill="url(#card)" stroke="#334155"/>
    <rect x="230" y="111" width="140" height="3" rx="1.5" fill="url(#accent)"/>
    <text x="300" y="160" fill="#E6EDF3" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Planner</text>
    <text x="300" y="181" fill="#94A3B8" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" text-anchor="middle">steps + routing</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="460" y="76" width="140" height="84" rx="18" fill="url(#card)" stroke="#334155"/>
    <rect x="460" y="76" width="140" height="3" rx="1.5" fill="url(#accent)"/>
    <text x="530" y="125" fill="#E6EDF3" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Retrieval</text>
    <text x="530" y="146" fill="#94A3B8" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" text-anchor="middle">grounded context</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="460" y="182" width="140" height="84" rx="18" fill="url(#card)" stroke="#334155"/>
    <rect x="460" y="182" width="140" height="3" rx="1.5" fill="url(#accent)"/>
    <text x="530" y="231" fill="#E6EDF3" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Tools</text>
    <text x="530" y="252" fill="#94A3B8" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" text-anchor="middle">APIs + actions</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="680" y="111" width="140" height="84" rx="18" fill="url(#card)" stroke="#334155"/>
    <rect x="680" y="111" width="140" height="3" rx="1.5" fill="url(#accent)"/>
    <text x="750" y="160" fill="#E6EDF3" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Execution</text>
    <text x="750" y="181" fill="#94A3B8" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" text-anchor="middle">stateful run</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="870" y="111" width="140" height="84" rx="18" fill="url(#card)" stroke="#334155"/>
    <rect x="870" y="111" width="140" height="3" rx="1.5" fill="url(#accent)"/>
    <text x="940" y="160" fill="#E6EDF3" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Validation</text>
    <text x="940" y="181" fill="#94A3B8" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" text-anchor="middle">checks + evals</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1048" y="111" width="132" height="84" rx="18" fill="url(#card)" stroke="#334155"/>
    <rect x="1048" y="111" width="132" height="3" rx="1.5" fill="url(#accent)"/>
    <text x="1114" y="152" fill="#E6EDF3" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Final</text>
    <text x="1114" y="174" fill="#E6EDF3" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Output</text>
  </g>
</svg>
