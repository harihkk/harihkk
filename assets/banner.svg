<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Hari Kancharla - AI Software Engineer</title>
  <desc id="desc">Premium dark slate-blue GitHub profile banner for Hari Kancharla, AI Software Engineer building agents, RAG, evals, and infrastructure.</desc>
  <defs>
    <style>
      .node { animation: pulse 4s ease-in-out infinite; transform-origin: center; }
      .node:nth-of-type(2n) { animation-delay: .8s; }
      .node:nth-of-type(3n) { animation-delay: 1.5s; }
      .net-line { stroke-dasharray: 10 12; animation: dash 14s linear infinite; }
      .wave { animation: drift 10s ease-in-out infinite alternate; }
      .panel-line { animation: fade 3.4s ease-in-out infinite alternate; }
      @keyframes pulse {
        0%, 100% { opacity: .72; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.16); }
      }
      @keyframes dash {
        to { stroke-dashoffset: -220; }
      }
      @keyframes drift {
        from { transform: translateX(-8px); opacity: .5; }
        to { transform: translateX(10px); opacity: .9; }
      }
      @keyframes fade {
        from { opacity: .18; }
        to { opacity: .58; }
      }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#050816"/>
      <stop offset="0.44" stop-color="#0B1430"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(888 90) rotate(115) scale(360 250)">
      <stop stop-color="#7AA2F7" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#7AA2F7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(256 294) rotate(-24) scale(420 180)">
      <stop stop-color="#38BDF8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="strokeBlue" x1="655" y1="72" x2="1120" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#93C5FD" stop-opacity="0.15"/>
      <stop offset="0.5" stop-color="#7AA2F7" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0.2"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" stroke="#94A3B8" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.28 0 0 0 0 0.55 0 0 0 0 1 0 0 0 0.9 0"/>
      <feBlend in="SourceGraphic"/>
    </filter>
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#020617" flood-opacity="0.38"/>
    </filter>
    <clipPath id="round">
      <rect width="1200" height="360" rx="28"/>
    </clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <rect width="1200" height="360" fill="url(#grid)"/>
    <rect width="1200" height="360" fill="url(#glowA)"/>
    <rect width="1200" height="360" fill="url(#glowB)"/>
    <path class="wave" d="M-40 308C122 250 248 255 390 292C513 324 634 324 758 272C879 221 997 113 1244 118" stroke="#7AA2F7" stroke-opacity="0.18" stroke-width="42"/>
    <path class="wave" d="M-28 306C136 249 254 259 394 292C523 322 626 321 757 272C879 226 982 126 1230 128" stroke="#93C5FD" stroke-opacity="0.36" stroke-width="2"/>
    <path class="net-line" d="M702 78L798 122L918 91L1036 148L1125 108" stroke="url(#strokeBlue)" stroke-width="2"/>
    <path class="net-line" d="M720 238L818 194L936 231L1044 184L1138 238" stroke="url(#strokeBlue)" stroke-width="2"/>
    <path class="net-line" d="M798 122L818 194M918 91L936 231M1036 148L1044 184M918 91L818 194M936 231L1036 148" stroke="#7AA2F7" stroke-opacity="0.18" stroke-width="1.4"/>
    <g filter="url(#softGlow)">
      <circle class="node" cx="702" cy="78" r="5" fill="#93C5FD"/>
      <circle class="node" cx="798" cy="122" r="6" fill="#7AA2F7"/>
      <circle class="node" cx="918" cy="91" r="5" fill="#38BDF8"/>
      <circle class="node" cx="1036" cy="148" r="6" fill="#7AA2F7"/>
      <circle class="node" cx="1125" cy="108" r="4" fill="#93C5FD"/>
      <circle class="node" cx="720" cy="238" r="4" fill="#38BDF8"/>
      <circle class="node" cx="818" cy="194" r="6" fill="#93C5FD"/>
      <circle class="node" cx="936" cy="231" r="5" fill="#7AA2F7"/>
      <circle class="node" cx="1044" cy="184" r="5" fill="#38BDF8"/>
      <circle class="node" cx="1138" cy="238" r="4" fill="#93C5FD"/>
    </g>
    <g opacity="0.92">
      <rect x="676" y="54" width="478" height="228" rx="24" fill="#020617" fill-opacity="0.2" stroke="#93C5FD" stroke-opacity="0.16"/>
      <rect class="panel-line" x="704" y="274" width="222" height="1" fill="#7AA2F7" fill-opacity="0.35"/>
      <rect class="panel-line" x="946" y="274" width="132" height="1" fill="#38BDF8" fill-opacity="0.2"/>
    </g>
    <g filter="url(#textShadow)">
      <text x="72" y="125" fill="#E6EDF3" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="62" font-weight="800" letter-spacing="-1.2">Hari Kancharla</text>
      <text x="76" y="174" fill="#93C5FD" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="28" font-weight="650">AI Software Engineer</text>
      <text x="76" y="221" fill="#CBD5E1" font-family="JetBrains Mono, Fira Code, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" font-weight="500">Agents • RAG • Evals • Infrastructure</text>
      <text x="77" y="267" fill="#94A3B8" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="500">Production-grade LLM systems with retrieval, tools, validation, and scalable infrastructure.</text>
    </g>
    <g>
      <rect x="76" y="294" width="126" height="34" rx="17" fill="#0F172A" fill-opacity="0.78" stroke="#7AA2F7" stroke-opacity="0.25"/>
      <text x="101" y="316" fill="#BFDBFE" font-family="JetBrains Mono, Fira Code, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600">LLM Systems</text>
      <rect x="216" y="294" width="92" height="34" rx="17" fill="#0F172A" fill-opacity="0.78" stroke="#7AA2F7" stroke-opacity="0.25"/>
      <text x="240" y="316" fill="#BFDBFE" font-family="JetBrains Mono, Fira Code, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600">Agents</text>
      <rect x="322" y="294" width="78" height="34" rx="17" fill="#0F172A" fill-opacity="0.78" stroke="#7AA2F7" stroke-opacity="0.25"/>
      <text x="348" y="316" fill="#BFDBFE" font-family="JetBrains Mono, Fira Code, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600">RAG</text>
      <rect x="414" y="294" width="82" height="34" rx="17" fill="#0F172A" fill-opacity="0.78" stroke="#7AA2F7" stroke-opacity="0.25"/>
      <text x="438" y="316" fill="#BFDBFE" font-family="JetBrains Mono, Fira Code, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600">Evals</text>
    </g>
  </g>
</svg>
