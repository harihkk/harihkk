<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-labelledby="title desc">
  <title id="title">Hari Krishna Kancharla</title>
  <desc id="desc">A minimal editorial GitHub profile header for Hari Krishna Kancharla.</desc>
  <defs>
    <style>
      .title {
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 54px;
        fill: #2C2C2A;
        font-weight: normal;
        letter-spacing: 2px;
      }
      .subtitle {
        font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        font-size: 16px;
        fill: #5A5A58;
        letter-spacing: 4px;
        text-transform: uppercase;
      }
      .accent {
        stroke: #C46C4F;
        stroke-width: 1.5;
        fill: none;
      }
      .dot {
        fill: #C46C4F;
      }
    </style>
  </defs>
  <rect width="1280" height="360" fill="transparent" />
  <g transform="translate(640, 180)">
    <circle cx="0" cy="-55" r="3" class="dot" />
    <line x1="0" y1="-35" x2="0" y2="-15" class="accent" />
    <text class="title" x="0" y="30" text-anchor="middle">Hari Krishna Kancharla</text>
    <line x1="-30" y1="65" x2="30" y2="65" class="accent" />
    <text class="subtitle" x="0" y="105" text-anchor="middle">Software &amp; Applied AI  ·  Boston, MA</text>
  </g>
</svg>
